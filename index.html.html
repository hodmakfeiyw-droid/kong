<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ถ่ายรูปส่ง Discord Webhook</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans Thai', 'Inter', sans-serif;
    }
    .mirror {
      transform: scaleX(-1);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-4">
  <main class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
    <header class="px-5 py-4 border-b border-slate-800 flex items-center justify-between gap-3">
      <div>
        <h1 class="text-lg font-semibold text-white">ถ่ายรูปส่ง Discord</h1>
        <p class="text-xs text-slate-400">เปิดกล้องเพื่อถ่ายภาพและส่งไปยัง Webhook</p>
      </div>
      <span id="cameraStatusBadge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/15 text-amber-300 border border-amber-500/30">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        <span>กำลังเตรียมกล้อง</span>
      </span>
    </header>

    <section class="p-5 space-y-4">
      <!-- Viewport -->
      <div class="relative w-full aspect-[4/3] bg-slate-950 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
        <video id="videoPreview" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <img id="photoPreview" alt="ภาพที่ถ่าย" class="hidden w-full h-full object-cover" />
        <canvas id="captureCanvas" class="hidden"></canvas>

        <!-- Camera Permission / Error Overlay -->
        <div id="cameraOverlay" class="hidden absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center text-center p-6 gap-3">
          <svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
          </svg>
          <p id="cameraOverlayText" class="text-sm text-slate-300">กรุณาอนุญาตการใช้งานกล้องเพื่อถ่ายรูป</p>
          <button id="retryCameraBtn" type="button" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-medium text-white transition cursor-pointer">
            เปิดกล้องอีกครั้ง
          </button>
        </div>

        <!-- Top-right quick controls -->
        <div id="liveTopControls" class="absolute top-3 right-3 flex items-center gap-2">
          <button id="switchCameraBtn" type="button" title="สลับกล้องหน้า/หลัง" class="p-2 rounded-lg bg-slate-900/80 hover:bg-slate-800 text-slate-200 border border-slate-700/70 backdrop-blur transition cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Optional Caption & Auto-send toggle -->
      <div class="space-y-3">
        <div>
          <label for="captionInput" class="block text-xs font-medium text-slate-400 mb-1">ข้อความแนบ (ไม่บังคับ)</label>
          <input id="captionInput" type="text" maxlength="500" placeholder="พิมพ์ข้อความที่จะส่งพร้อมรูป..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" />
        </div>

        <label class="flex items-center justify-between gap-3 px-3.5 py-2.5 rounded-xl bg-slate-950/60 border border-slate-800/80 cursor-pointer select-none">
          <span class="text-xs text-slate-300">ส่งไปยัง Discord ทันทีหลังกดถ่ายรูป</span>
          <input id="autoSendToggle" type="checkbox" checked class="w-4 h-4 accent-indigo-500 rounded cursor-pointer" />
        </label>
      </div>

      <!-- Action Buttons -->
      <div id="liveActions" class="flex items-center gap-3">
        <button id="captureBtn" type="button" disabled class="flex-1 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed text-white font-semibold text-sm flex items-center justify-center gap-2 transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="13" r="3.5" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8.5A2.5 2.5 0 0 1 6.5 6h2l1.2-1.8A1.5 1.5 0 0 1 11 3.5h2a1.5 1.5 0 0 1 1.3.7L15.5 6h2A2.5 2.5 0 0 1 20 8.5v9A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-9Z" />
          </svg>
          <span>ถ่ายรูป</span>
        </button>
      </div>

      <div id="reviewActions" class="hidden flex items-center gap-3">
        <button id="retakeBtn" type="button" class="flex-1 py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-sm transition cursor-pointer">
          ถ่ายใหม่
        </button>
        <button id="sendBtn" type="button" class="flex-1 py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-semibold text-sm flex items-center justify-center gap-2 transition cursor-pointer">
          <span>ส่งไปยัง Discord</span>
        </button>
      </div>

      <!-- Status Banner -->
      <div id="statusBanner" class="hidden rounded-xl px-4 py-3 text-xs font-medium border"></div>
    </section>
  </main>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1570787286445072535/a7qqpQlf-QAm_7rXTPKCBTnGy_PkufurfXHw5VdqW4JSKVxHP1FdQqmRA_Ql7k1q-Tat";

    const videoPreview = document.getElementById("videoPreview");
    const photoPreview = document.getElementById("photoPreview");
    const captureCanvas = document.getElementById("captureCanvas");
    const cameraOverlay = document.getElementById("cameraOverlay");
    const cameraOverlayText = document.getElementById("cameraOverlayText");
    const cameraStatusBadge = document.getElementById("cameraStatusBadge");
    const liveTopControls = document.getElementById("liveTopControls");

    const retryCameraBtn = document.getElementById("retryCameraBtn");
    const switchCameraBtn = document.getElementById("switchCameraBtn");
    const captureBtn = document.getElementById("captureBtn");
    const retakeBtn = document.getElementById("retakeBtn");
    const sendBtn = document.getElementById("sendBtn");

    const liveActions = document.getElementById("liveActions");
    const reviewActions = document.getElementById("reviewActions");
    const captionInput = document.getElementById("captionInput");
    const autoSendToggle = document.getElementById("autoSendToggle");
    const statusBanner = document.getElementById("statusBanner");

    let currentStream = null;
    let facingMode = "user";
    let capturedBlob = null;
    let capturedObjectUrl = null;
    let isSending = false;

    function setBadge(state, text) {
      cameraStatusBadge.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border";
      if (state === "ready") {
        cameraStatusBadge.classList.add("bg-emerald-500/15", "text-emerald-300", "border-emerald-500/30");
        cameraStatusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>' + text + "</span>";
      } else if (state === "error") {
        cameraStatusBadge.classList.add("bg-rose-500/15", "text-rose-300", "border-rose-500/30");
        cameraStatusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-400"></span><span>' + text + "</span>";
      } else {
        cameraStatusBadge.classList.add("bg-amber-500/15", "text-amber-300", "border-amber-500/30");
        cameraStatusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span><span>' + text + "</span>";
      }
    }

    function showStatus(type, message) {
      statusBanner.className = "rounded-xl px-4 py-3 text-xs font-medium border";
      if (type === "success") {
        statusBanner.classList.add("bg-emerald-500/15", "text-emerald-300", "border-emerald-500/30");
      } else if (type === "error") {
        statusBanner.classList.add("bg-rose-500/15", "text-rose-300", "border-rose-500/30");
      } else {
        statusBanner.classList.add("bg-indigo-500/15", "text-indigo-300", "border-indigo-500/30");
      }
      statusBanner.textContent = message;
      statusBanner.classList.remove("hidden");
    }

    function hideStatus() {
      statusBanner.classList.add("hidden");
    }

    function stopCurrentStream() {
      if (currentStream) {
        currentStream.getTracks().forEach((track) => track.stop());
        currentStream = null;
      }
    }

    async function startCamera() {
      stopCurrentStream();
      setBadge("loading", "กำลังเตรียมกล้อง");
      captureBtn.disabled = true;
      cameraOverlay.classList.add("hidden");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setBadge("error", "ไม่รองรับกล้อง");
        cameraOverlayText.textContent = "เบราว์เซอร์นี้ไม่รองรับการเข้าถึงกล้อง หรือต้องเปิดผ่าน HTTPS";
        cameraOverlay.classList.remove("hidden");
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode },
          audio: false
        });
        currentStream = stream;
        videoPreview.srcObject = stream;
        if (facingMode === "user") {
          videoPreview.classList.add("mirror");
        } else {
          videoPreview.classList.remove("mirror");
        }
        await videoPreview.play();
        setBadge("ready", "กล้องพร้อมใช้งาน");
        captureBtn.disabled = false;
      } catch (err) {
        setBadge("error", "เข้าถึงกล้องไม่ได้");
        cameraOverlayText.textContent = "ไม่สามารถเปิดกล้องได้: " + (err && err.message ? err.message : "กรุณาอนุญาตสิทธิ์กล้อง");
        cameraOverlay.classList.remove("hidden");
      }
    }

    function showReviewMode(blob) {
      if (capturedObjectUrl) {
        URL.revokeObjectURL(capturedObjectUrl);
      }
      capturedBlob = blob;
      capturedObjectUrl = URL.createObjectURL(blob);
      photoPreview.src = capturedObjectUrl;

      videoPreview.classList.add("hidden");
      liveTopControls.classList.add("hidden");
      photoPreview.classList.remove("hidden");
      liveActions.classList.add("hidden");
      reviewActions.classList.remove("hidden");
    }

    function showLiveMode() {
      if (capturedObjectUrl) {
        URL.revokeObjectURL(capturedObjectUrl);
        capturedObjectUrl = null;
      }
      capturedBlob = null;
      photoPreview.src = "";
      photoPreview.classList.add("hidden");
      videoPreview.classList.remove("hidden");
      liveTopControls.classList.remove("hidden");
      reviewActions.classList.add("hidden");
      liveActions.classList.remove("hidden");
    }

    async function sendToDiscord(blob) {
      if (!blob || isSending) return;
      isSending = true;
      sendBtn.disabled = true;
      retakeBtn.disabled = true;
      captureBtn.disabled = true;
      showStatus("info", "กำลังส่งรูปภาพไปยัง Discord...");

      try {
        const formData = new FormData();
        const filename = "photo_" + Date.now() + ".jpg";
        formData.append("file", blob, filename);

        const caption = captionInput.value.trim();
        if (caption) {
          formData.append("payload_json", JSON.stringify({ content: caption }));
        }

        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          let errDetail = "HTTP " + response.status;
          try {
            const text = await response.text();
            if (text) errDetail += " - " + text;
          } catch (_) {}
          throw new Error(errDetail);
        }

        showStatus("success", "ส่งรูปภาพไปยัง Discord เรียบร้อยแล้ว");
      } catch (err) {
        showStatus("error", "ส่งรูปภาพไม่สำเร็จ: " + (err && err.message ? err.message : "เกิดข้อผิดพลาด"));
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        retakeBtn.disabled = false;
        captureBtn.disabled = !currentStream;
      }
    }

    function capturePhoto() {
      if (!currentStream || videoPreview.videoWidth === 0) {
        showStatus("error", "กล้องยังไม่พร้อมสำหรับถ่ายภาพ");
        return;
      }
      hideStatus();

      const width = videoPreview.videoWidth;
      const height = videoPreview.videoHeight;
      captureCanvas.width = width;
      captureCanvas.height = height;

      const ctx = captureCanvas.getContext("2d");
      ctx.save();
      if (facingMode === "user") {
        ctx.translate(width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(videoPreview, 0, 0, width, height);
      ctx.restore();

      captureCanvas.toBlob(
        async (blob) => {
          if (!blob) {
            showStatus("error", "ไม่สามารถสร้างไฟล์รูปภาพได้");
            return;
          }
          showReviewMode(blob);
          if (autoSendToggle.checked) {
            await sendToDiscord(blob);
          }
        },
        "image/jpeg",
        0.92
      );
    }

    retryCameraBtn.addEventListener("click", startCamera);

    switchCameraBtn.addEventListener("click", () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      startCamera();
    });

    captureBtn.addEventListener("click", capturePhoto);

    retakeBtn.addEventListener("click", () => {
      hideStatus();
      showLiveMode();
    });

    sendBtn.addEventListener("click", () => {
      sendToDiscord(capturedBlob);
    });

    window.addEventListener("beforeunload", stopCurrentStream);
    window.addEventListener("load", startCamera);
  </script>
</body>
</html>
